apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: my-app-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: quay.io/your-username/frontend:latest # استبدل your-username بـ username الخاص بك
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "300m"
            memory: "256Mi"
          requests:
            cpu: "50m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: my-app-prod
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend-route
  namespace: my-app-prod
spec:
  to:
    kind: Service
    name: frontend-service
  port:
    targetPort: 80
  wildcardPolicy: None
